    price_year: 2020
    index: gdp
    tag: SOURCED
    source: "WECA, Mass Transit (Future4WEST) draft Financial Dimension (WSP, Jan 2023), §4.3.42: £1,250 per metre a year, 2020/21 prices, \"benchmarks from similar projects\""
