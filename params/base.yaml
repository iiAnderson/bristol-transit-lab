# Gap map (plans/P2.md C5, revised 2026-10-09).
gapmap:
  min_distance_km:
    value: 2.0
    unit: km, straight line between population-weighted centroids
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-10-09. Below about 2 km most "PT" is a walk and car in-vehicle time is
      2–5 minutes, so a minute of parking time swings the PT ÷ car ratio; those pairs and
      intrazonal pairs are reported separately, not mapped.

# Routing settings shared by r5r (PT) and r5py (walk, cycle), passed identically to
# both (plans/P2.md D7). The departure window is skims.departure_window_min.
routing:
  max_rides:
    value: 8
    unit: public transport rides per trip
    tag: MODELLED
    reasoning: >-
      r5py's default; r5r's default is 3, which changed p50 times on the D7 comparison.
      8 is effectively unlimited for this network, so the router, not a cap, decides.
  r5py_truncation_correction_min:
    value: 0.5
    unit: min added to r5py matrix times (walk and cycle skims) in the column travel_time_corrected
    tag: MODELLED
    reasoning: >-
      r5py's travel time matrix truncates to the whole minute (measured: 95% of 563 walk
      pairs equal the floor of the itinerary time, mean −0.43 min); half a minute is the
      unbiased correction. The raw R5 value stays in travel_time. r5r's expanded matrix
      (PT skims) reports tenths and is not corrected (Robbie, 2026-10-10).
  elevation_cost_function:
    value: TOBLER
    unit: R5 slope cost function applied to walking and cycling (NONE = flat network)
    tag: MODELLED
    reasoning: >-
      Network v2 (Robbie, 2026-10-10): terrain from OS Terrain 50 with Tobler's hiking
      function, the smaller departure from the sourced flat speeds (walk +6.6% against
      Minetti's +13.9%; sources.md P3a). R5 applies one function to both modes: Tobler
      likely under-penalises cycling uphill, a recorded limitation of the cycle skims
      (revisit in P5). LAB_NETWORK=flat in the environment reproduces network v1.
  walk_speed_terrain_factor:
    value: 1.0318
    unit: multiplier on walk_speed_kmh when the terrain model is on (4.953 km/h)
    tag: MODELLED
    reasoning: >-
      R5's slope cost never speeds walking up, and a 50 m terrain grid is noisy, so with
      terrain even the flattest fifth of OAs (terrain s.d. within 500 m below 4.8 m) walk
      3.2% slower. 4.8 km/h is a flat-network convention, so the base speed is rescaled
      until those OAs average 4.8 km/h effective: factor = their terrain ÷ flat walk-time
      ratio, 1.0318 (13,805 pairs within 30 min); check after rescaling 0.9994. All OAs
      then +3.3%, the steepest fifth +7.2% (Robbie, 2026-10-10; plans/P3.md §9).
  walk_speed_kmh:
    value: 4.8
    unit: km/h
    tag: SOURCED
    source: >-
      DfT Journey Time Statistics: Notes and Definitions, journey-time calculation
      parameters: "Walking speed on road/path network of 4.8km/h."
      https://assets.publishing.service.gov.uk/media/5dfa46f2ed915d54ab87c859/notes-and-definitions.pdf
      (checked 2026-10-09). TfL's "Assessing transport connectivity in London" assumes the
      same 4.8 kph for PTAL and public-transport access times.
    note: >-
      Robbie, 2026-10-09. Replaces R5's default 3.6 km/h, which made the model 5–10% slower
      than journey planners in the PT spot checks (a 1.5 km walk: planner 19 min, model 25
      at 3.6 km/h, 19 at 4.8 km/h).
  cycle_speed_kmh:
    value: 16.0
    unit: km/h
    tag: SOURCED
    source: >-
      DfT Journey Time Statistics: Notes and Definitions, "Cycling speeds" table: 16.0 km/h
      on A, B, minor roads and local streets (4.8 km/h on pedestrian streets and alleys).
      https://assets.publishing.service.gov.uk/media/5dfa46f2ed915d54ab87c859/notes-and-definitions.pdf
      (checked 2026-10-09).
    note: >-
      Robbie, 2026-10-09; replaces R5's default 12 km/h. A flat speed: no elevation model
      is loaded (the network is built from the OSM clip and GTFS only), so cycling times
      ignore gradients — material in Bristol and Bath; flagged for P5.
  max_bicycle_lts:
    value: 3
    unit: level of traffic stress (1–4)
    tag: PLACEHOLDER
    note: r5py default 3; r5r default 2 — must be passed explicitly to both; to be justified
  max_walk_min:
    value: null
    unit: min of walking per trip (access, transfer, egress)
    tag: PLACEHOLDER
    note: both engines default to no limit beyond the trip duration; decide in P2c
  max_trip_min:
    value: 120
    unit: min
    tag: MODELLED
    reasoning: >-
      Both engines' default. Longer than any internal commute of interest; pairs beyond
      it are unreachable.
  pt_reachable_share_min:
    value: 0.5
    unit: share of departure minutes in the window
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-27 (D7): a pair is PT-unreachable if fewer than half the departure
      minutes have a route; this matches r5py's p50 (undefined below 50%).

