# Behavioural and model parameters. Every value carries a tag (CLAUDE.md rule 2):
#   SOURCED needs `source`; CALIBRATED needs `target`; MODELLED needs `reasoning`;
#   PLACEHOLDER must be resolved before any published output.
# Values the spec attributes to a publication stay PLACEHOLDER until that publication
# has been opened and the figure confirmed (rule 3) — the claimed source is in `note`.
# `lab params` lists them; src/lab/params.py enforces the schema.

_meta:
  price_base: null        # set when the TAG data book values are entered (P5)
  status: P0 skeleton

commute:
  # d = 1 − (workers attending a fixed workplace on an average weekday ÷ BRES jobs).
  # Derived by src/lab/demand/bres_discount.py from the raw tables; tests check these
  # values match the derivation. Not the census TS058 36.2% (lockdown home-working,
  # already removed on the census side). See sources.md P1.
  bres_discount:
    low:
      value: 0.429
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − ONS OPN (GB, 8 Jan–30 Mar 2025, Table_1 by working pattern) attendance with
        hybrid workers on site 3 days/week and part-timers working 3.5 days. OPN counts
        anyone who travelled in the past 7 days, so it over-counts attendance: floor on d.
    central:
      value: 0.539
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − midpoint of OPN attendance (hybrid 2.5 days on site, per Indeed Hiring Lab
        Sept 2025; part-timers 3 days) and NTS attendance. The two are biased in
        opposite directions; the midpoint is a modelled choice.
    high:
      value: 0.604
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − NTS 2025 attendance: NTS0412 222.8 commuting trips per employed person
        per year × NTS0504b weekday share 0.899 ÷ 2 ÷ 253 weekdays. NTS counts only
        home ↔ usual-workplace trips, so it under-counts attendance: ceiling on d.
  destination_factor_check:
    value: 4.0
    unit: max in-extent destination factor
    tag: MODELLED
    reasoning: >-
      Was upstream's clipping cap (p95 rule, Bristol 2026-08). Now a check: the build
      fails if any in-extent destination factor exceeds it, instead of clipping. After
      the discount and the LSOA-centroid zone rule the largest factor is 2.55 (low d);
      the two MSOAs that used to reach it (Cotswold 011, Sedgemoor 002) were
      boundary slivers and are now external.
  ca_min_commuters:
    value: 10
    unit: ODWP14EW commuters in the cell
    tag: MODELLED
    reasoning: >-
      Smallest cell whose own car-availability split is used, at pair level and then at
      origin MSOA × destination LAD, before falling back to the origin MSOA. Upstream
      measured MSOA→MSOA at a mean flow of 21.95.

generalised_cost:
  w_walk:
    value: 2.0
    unit: IVT-min per walk-min (access, egress, transfer walking)
    tag: MODELLED
    reasoning: >-
      Top of TAG M3.2 (May 2024) Table 1 indicative range 1.5–2.0 for access/egress/
      transfer time; TAG expects these weights to be adjusted in calibration (§9).
      https://assets.publishing.service.gov.uk/media/666af32effd07973a043d110/tag-unit-m3.2-public-transport-assignment-modelling.pdf
  w_wait:
    value: 2.0
    unit: IVT-min per wait-min (first wait from the wait curve, and transfer waits)
    tag: MODELLED
    reasoning: >-
      Mid TAG M3.2 (May 2024) Table 1 indicative range 1.5–2.5 for waiting time (initial
      or at interchange); subject to calibration (§9).
  p_interchange:
    value: 7.5
    range: [2, 10]
    unit: min per transfer
    tag: MODELLED
    reasoning: >-
      Within TAG M3.2 (May 2024) Table 1 indicative range 2–10 min for a boarding or
      transfer penalty (larger for long-distance rail); subject to calibration (§9).
  first_wait_curve:
    value: [[0, 0], [10, 5.0], [20, 9.5], [30, 11.5], [40, 13.0], [60, 15.5], [90, 19.5]]
    unit: "[effective headway min, perceived first wait min]; linear between points, slope 0.13 beyond 90"
    tag: SOURCED
    source: >-
      TAG unit M3.2 Public Transport Assignment Modelling (May 2024), Figure 2 "Examples
      of Wait Curves", illustrative wait curve (a figure, not a table), digitised by eye
      (±0.5 min); §3.2.3–3.2.9.
      https://assets.publishing.service.gov.uk/media/666af32effd07973a043d110/tag-unit-m3.2-public-transport-assignment-modelling.pdf
    note: >-
      TAG M3.2 (May 2024) §3.2.3–3.2.8 and Figure 2 "illustrative wait curve": waiting
      rises at a lower rate than headway for infrequent services because passengers time
      their arrival; applied to the first boarding only (§3.2.5), transfer waits being
      exact in a timetable model (§3.2.9). Points digitised by eye from Figure 2
      (±0.5 min); TAG presents it as illustrative (PDFH B4 curves need membership). The
      uncapped form is used, not the capped one, so services with different headways do
      not get the same utility (§3.2.8). Effective headway = 2 × (mean total over the
      departure window − best-departure total).
  mode_constant_mass_transit:
    value: 0.0
    unit: min
    tag: MODELLED
    reasoning: >-
      Zero by default (SPEC §7.2). A non-zero quality bonus is the easiest way to
      flatter a scheme; if one is introduced, always report a run without it.
  game_weights:
    w_walk:
      value: 1.39
      unit: IVT-min per walk-min
      tag: PLACEHOLDER
      note: Subway Builder published weights, per spec; sensitivity runs only; verify
    w_wait:
      value: 1.37
      unit: IVT-min per wait-min
      tag: PLACEHOLDER
      note: Subway Builder published weights, per spec; sensitivity runs only; verify

skims:
  am_peak_hour:
    value: "08:00-09:00"
    unit: local time
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-28: the AM skim for car and PT is the 08:00–09:00 peak hour (the
      demand AM period stays 07:00–10:00, SPEC §6.3); the 07:00–10:00 car average is kept
      as a sensitivity skim.
  window_start:
    AM:
      value: "08:00"
      unit: local time; start of the departure window
      tag: MODELLED
      reasoning: the peak hour inside the AM period (07:00–10:00), where commuting departures concentrate
    IP:
      value: "12:00"
      unit: local time; start of the departure window
      tag: MODELLED
      reasoning: mid inter-peak (10:00–16:00), away from school-run edges
  hbw_dest_point_abs_min:
    value: 2.0
    unit: min, flow-weighted median |change| in HBW PT or car time
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-27 (D3): above this (or the relative threshold) job-weighted LSOA
      points replace PWCs for HBW destinations.
  hbw_dest_point_rel:
    value: 0.05
    unit: share, flow-weighted median |relative change|
    tag: MODELLED
    reasoning: Robbie, 2026-09-27 (D3); see hbw_dest_point_abs_min.
  departure_window_min:
    value: 60
    unit: min
    tag: MODELLED
    reasoning: spec default (§7.1); smooths timetable phase without spanning periods
  percentiles:
    value: [25, 50, 75]
    unit: percentile
    tag: MODELLED
    reasoning: spec default (§7.1); p50 for accessibility, p25/p75 for spread

assignment:
  crowding_flag_load_factor:
    value: 0.8
    unit: pax / capacity
    tag: MODELLED
    reasoning: spec threshold (§7.4) for flagging links; no feedback into GC in v1

periods:
  AM: {value: "07:00-10:00", tag: MODELLED, reasoning: spec §6.3 period definition}
  IP: {value: "10:00-16:00", tag: MODELLED, reasoning: spec §6.3 period definition}
  PM: {value: "16:00-19:00", tag: MODELLED, reasoning: spec §6.3 period definition}
  EVE:
    value: "19:00-22:00"
    tag: MODELLED
    reasoning: >-
      Evening band for frequent-service coverage only (Robbie, 2026-10-09, plans/P3.md
      Q6), so that "frequent all day" can be reported; not a demand period.
  AMPH:
    value: "08:00-09:00"
    tag: MODELLED
    reasoning: the AM skim hour (skims.window_start.AM plus the 60-minute window), reported beside the periods for consistency with the skims

# Frequent-service coverage (plans/P3.md P3a; SPEC §8.2 as amended at P3).
coverage:
  headline_periods:
    value: [AM, IP]
    tag: MODELLED
    reasoning: >-
      The headline service level of a stop cluster is the worse of these periods, so a
      peak-only service does not count as frequent (Robbie, 2026-10-09, Q6).
  frequent_headway_min:
    value: [10, 15]
    unit: min between departures in one direction; every listed threshold is reported
    tag: MODELLED
    reasoning: >-
      15 min is "frequent" and the headline, matching the scheme design standard; 10 min
      is reported as "high frequency" (Robbie, 2026-10-10, P3a stop decision 4).
  headline_headway_min:
    value: 15
    unit: min; which of frequent_headway_min is the headline
    tag: MODELLED
    reasoning: Robbie, 2026-10-10 (P3a stop decision 4).
  walk_truncation_correction_min:
    value: 0.5
    unit: min added to every R5 walking time used in coverage
    tag: MODELLED
    reasoning: >-
      R5's matrix truncates walking times to the whole minute (563 pairs against
      itinerary seconds: 95% equal the floor, mean −0.43 min; sources.md P3a). Half a
      minute is the unbiased correction for a truncated value. The uncorrected figure is
      reported alongside (Robbie, 2026-10-10, P3a stop decision 3).
  max_walk_min:
    value: 30
    unit: min of walking from an OA centroid to a stop; pairs beyond it are not stored
    tag: MODELLED
    reasoning: >-
      2.4 km at 4.8 km/h: above the 85th-percentile walk to a rail station in the
      candidate decay (1,610 m, 20 min), so the cap cuts only the tail of the weights.
  cluster_same_name_m:
    value: 150
    unit: m, straight line
    tag: MODELLED
    reasoning: >-
      Stops with the same name this close are treated as one stop cluster (the two
      sides of a road, the stands of a small interchange). Paired stops are staggered
      by up to about 100 m; 150 m leaves a margin. Plans/P3.md D4; reviewed on a plot.
  cluster_any_name_m:
    value: 40
    unit: m, straight line
    tag: MODELLED
    reasoning: >-
      Stops this close are one cluster whatever they are called (adjacent stands with
      different names). About two bus lengths plus a carriageway.
  cluster_max_walk_min:
    value: 4
    unit: min of walking on the network between two stops of one cluster
    tag: MODELLED
    reasoning: >-
      Barrier test: 150 m in a straight line is a 2-minute walk; a pair further apart
      than 4 minutes on the network (320 m) has a river, railway or dual carriageway
      between it and is not one stop to a passenger.
  direction_min_share:
    value: 0.1
    unit: share of a cluster's departures in a compass octant for that direction to count
    tag: MODELLED
    reasoning: stops a handful of short workings or diversions from making a one-way stop look two-way
  score_cap_dph:
    value: 12
    unit: departures per hour in one direction; the continuous score counts no more than this per cluster
    tag: MODELLED
    reasoning: >-
      A 5-minute headway is turn-up-and-go; further departures add capacity, not
      access. Stops a bus-station cluster from dominating the continuous score.
  # The furthest walk at which a stop still "serves" an OA — separate from the decay
  # curves, which weight how many would walk that far (Robbie, 2026-10-10).
  served_walk_min:
    value: {bus: 8, brt: 8, ferry: 8, rail: 12, tram: 12, metro: 12}
    unit: min of walking at 4.8 km/h effective, by mode class (headline cut-off)
    tag: SOURCED
    source: >-
      TfL, "Assessing transport connectivity in London" (PTAL method),
      https://content.tfl.gov.uk/connectivity-assessment-guide.pdf (opened 2026-10-10):
      "people will walk up to 640 metres (approximately eight minutes) to a bus service
      and up to 960 metres (12 minutes) to a rail or Tube service", at 4.8 kph. BRT takes
      the bus value and tram the rail value by Robbie's decision; ferry takes bus.
  served_walk_loose_m:
    value: {bus: 800, brt: 800, ferry: 800, rail: 1610, tram: 1610, metro: 1610}
    unit: m; the loose variant of the served cut-off, converted at 4.8 km/h
    tag: PLACEHOLDER
    note: >-
      Wakenshaw and Bunn (WYG) 2015 85th percentiles as quoted second-hand (Oxfordshire
      CC review); the paper has not been opened. Reported as the loose variant only,
      labelled as unverified. The strict variant is the decay curves' own 85th
      percentiles (El-Geneidy et al. 2014).
  reduced_mobility_scale_sensitivity:
    value: [0.5, 0.85]
    unit: alternative values of reduced_mobility_scale, each reported
    tag: MODELLED
    reasoning: Robbie, 2026-10-10 — a range either side of 0.7, which has no observed basis yet.
  reduced_mobility_scale:
    value: 0.7
    unit: multiplier on every distance the decay curves are defined on, in the reduced-mobility variant
    tag: MODELLED
    reasoning: >-
      People who walk less far, reported alongside for equity (plans/P3.md D2). First
      defined as a 400 m half-weight point for bus, which was 0.70 of the first candidate
      curve's; the sourced bus curve's half-weight point is already 245 m, so the same
      proportion is kept as a scale rather than a distance (confirmed by Robbie,
      2026-10-10, with the sensitivity below). Lead not yet opened: DfT Inclusive
      Mobility (2021), recommended walking distances for disabled people.
  # Walk-to-stop distances by mode: the decay weight at distance d is the share of
  # observed walks that are at least that long. Source (Robbie, 2026-10-10): Montréal's
  # 2003 origin–destination survey, 16,014 home-based transit trips, walking distance on
  # the network from home to the first stop — NOT UK DATA. Distances in the source stop
  # at about 1.5 km. The UK figures first proposed (Wakenshaw and Bunn, WYG 2015: bus
  # 85th percentile 800 m, rail 1,610 m) could not be opened and are much longer:
  # sources.md P3 records the disagreement. Cross-check only: TfL's PTAL takes 640 m
  # (8 min) to a bus and 960 m (12 min) to rail as the furthest walk.
  decay:
    bus:
      mean_m:
        value: 296
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), Table 2: mean walking distance by bus operator (275.96, 314.50, 347.01,
          488.73 m) weighted by the table's n (8,745, 1,628, 887, 538). Non-UK. The
          weighting is this repo's; the paper gives no pooled bus mean.
      p85_m:
        value: 524
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), abstract and conclusion: "The 85th percentile walking distance to bus
          transit service is around 524 meters from home-based trip origins". Non-UK.
          Table 2's operator values run from 484 m (city) to 897 m (outer suburban).
    rail:
      mean_m:
        value: 818
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), Table 2, Train (commuter rail): mean 817.98 m, n = 493. Non-UK.
      p85_m:
        value: 1259
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), Table 2, Train: 85th percentile 1,259.41 m. Non-UK.
    metro:
      mean_m:
        value: 565
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), Table 2, Metro: mean 564.80 m, n = 3,723. Non-UK.
      p85_m:
        value: 873
        unit: m
        tag: SOURCED
        source: >-
          El-Geneidy, Grimsrud, Wasfi, Tétreault and Surprenant-Legault (2014), "New evidence on walking distances to transit stops: identifying redundancies and gaps using variable service areas", Transportation 41:193–210; authors' version https://www.tram.mcgill.ca/Research/Publications/Transit_service_area.pdf (opened 2026-10-10), Table 2, Metro: 85th percentile 873.35 m. Non-UK.
    brt_towards_rail:
      value: 0.33
      unit: position of the BRT decay between bus (0) and rail (1)
      tag: MODELLED
      reasoning: >-
        No observed walk distances for BRT. People walk further to faster, more
        legible services; BRT here runs partly in mixed traffic, so it sits nearer
        bus. Sensitivity runs at 0 and 1 (plans/P3.md D2).
    tram_towards_rail:
      value: 0.67
      unit: position of the tram / light-rail decay between bus (0) and rail (1)
      tag: MODELLED
      reasoning: >-
        No observed UK walk distances by tram in the source. Fixed track and higher
        speed put it nearer rail. Sensitivity runs at 0 and 1 (plans/P3.md D2).
  # Service-quality classes after the Swiss ARE method (ÖV-Güteklassen): a stop
  # category from the kind of service and the interval between departures in one
  # direction, then a class from the category and the distance to the stop.
  # Source for both tables: Bundesamt für Raumentwicklung ARE (2013), "Reisezeiten und
  # ÖV-Güteklassen: Aktualisierung der Geodaten und Karten", Tabelle 3 and Tabelle 4
  # (opened 2026-10-09). Adapted here: the interval is per period, not 06:00–20:00;
  # distance is walking on the network, not a straight line.
  are_interval_bands_min:
    value: [5, 10, 20, 40, 60]
    unit: upper edges of the interval bands (min); the source prints "< 5, 6–9, 10–19, 20–39, 40–60"
    tag: SOURCED
    source: ARE (2013) Reisezeiten und ÖV-Güteklassen, Tabelle 3. https://www.are.admin.ch/dam/de/sd-web/HlgJAh7C0Tq1/reisezeiten_und_oev-gueteklassen.pdf
  are_stop_category:
    value: {rail_node: [1, 1, 2, 3, 4], rail_line: [1, 2, 3, 4, 5], street: [2, 3, 4, 5, 5]}
    unit: stop category I–V (1–5) per interval band; street = tram, bus, ferry (ARE group B)
    tag: SOURCED
    source: ARE (2013) Reisezeiten und ÖV-Güteklassen, Tabelle 3 (Bahnknoten, Bahnlinien, VM-Gruppe B).
  are_distance_bands_m:
    value: [300, 500, 750, 1000]
    unit: upper edges of the distance bands (m)
    tag: SOURCED
    source: ARE (2013) Reisezeiten und ÖV-Güteklassen, Tabelle 4.
  are_class:
    value: {1: [A, A, B, C], 2: [A, B, C, D], 3: [B, C, D, none], 4: [C, D, none, none], 5: [D, none, none, none]}
    unit: class per distance band, by stop category
    tag: SOURCED
    source: ARE (2013) Reisezeiten und ÖV-Güteklassen, Tabelle 4.
  rail_node_min_directions:
    value: 3
    unit: compass octants with departures (each at least direction_min_share) for a station to be a rail node
    tag: MODELLED
    reasoning: >-
      ARE defines a rail node as several lines in different directions without a
      numeric rule. Three or more departure directions separates junction stations
      from stations on one line (which have two).

supply:
  clip_buffer_km:
    value: 5
    unit: km beyond the extent
    tag: MODELLED
    reasoning: >-
      Feeds (OSM, bus GTFS, vehicle locations) are clipped to the extent plus this
      margin so that routes and bus tracks near the edge are not truncated. 5 km is
      about one inter-urban bus stage; the plan's default (plans/P2.md A3).

  dem_res_deg:
    value: 0.0005
    unit: degrees per cell of the terrain raster given to R5
    tag: MODELLED
    reasoning: >-
      About 35 m east–west and 56 m north–south at this latitude: no coarser than the
      50 m source grid (OS Terrain 50), so the warp to WGS84 loses nothing, and no
      finer, which would only interpolate. Plans/P3.md D1.

# P2 car congestion (plans/P2.md §5). Set in P2b from the vehicle-location data; the
# notes give the starting values to test.
congestion:
  stop_buffer_m:
    value: 30
    unit: m from a GTFS stop
    tag: MODELLED
    reasoning: >-
      A slow leg (below min_moving_kmh) with either end this close to a GTFS stop is dwell and dropped; slow legs elsewhere are queueing and kept. 30 m is about two bus lengths around the stop marker, enough for GPS error and a bus stopping short. Cannot be sourced; sensitivity at ±50% in plans/P2.md §9 (2026-10-09).
  min_moving_kmh:
    value: 5
    unit: km/h
    tag: MODELLED
    reasoning: >-
      Below walking pace a bus is stationary or creeping; 5 km/h separates dwell from movement near stops. Cannot be sourced; sensitivity at ±50% in plans/P2.md §9 (2026-10-09).
  min_obs_per_link:
    value: 10
    unit: traversals per segment × direction × period
    tag: MODELLED
    reasoning: >-
      Ten legs keep one unusual pass from setting a segment's speed while leaving most bus-served segments usable (random half-splits of such cells differ by a median 6%). Cannot be sourced; sensitivity at ±50% in plans/P2.md §9 (2026-10-09).
  match_radius_m:
    value: 25
    unit: m (OSRM match radius per position)
    tag: MODELLED
    reasoning: >-
      GPS error of bus AVL is typically 5–15 m; 25 m tolerates it without letting
      positions jump to parallel streets.
  trace_gap_s:
    value: 120
    unit: s
    tag: MODELLED
    reasoning: >-
      A vehicle trace is split where consecutive fixes are further apart than this;
      fixes are ~31 s apart at the median (8 Sep), p90 60 s.
  max_leg_s:
    value: 90
    unit: s between consecutive fixes in a leg
    tag: MODELLED
    reasoning: Longer legs average over stops and turns; p90 of fix spacing is 60 s.
  max_kmh:
    value: 130
    unit: km/h
    tag: MODELLED
    reasoning: Implausible leg speeds (matching errors) are dropped.
  match_min_confidence:
    value: 0.3
    unit: OSRM matching confidence (0–1)
    tag: MODELLED
    reasoning: >-
      Low-confidence matchings (often buses on bus-only links the car profile lacks) are
      dropped; the drop rate is reported by area type.
  busway_buffer_m:
    value: 25
    unit: m
    tag: MODELLED
    reasoning: >-
      Positions this close to a busway or bus-only link are dropped (B1): the car-profile
      matcher would snap them onto nearby general roads.
  min_cells:
    value: 20
    unit: segments per shape cell (period × direction × area × class group)
    tag: MODELLED
    reasoning: >-
      A bus-derived ratio is used only when at least this many segments each have
      min_obs_per_link traversals; otherwise the cell falls back to the national ratio.
  fit_ridge_lambda:
    value: 1.0
    unit: weight on (log authority multiplier)² in the level fit
    tag: MODELLED
    reasoning: >-
      Pulls authority multipliers towards 1 unless targets demand otherwise (parsimony,
      plans/P2.md §5); reported with the fit.
  fit_road_ridge_lambda:
    value: 0.1
    unit: weight on (log road multiplier)² in the level fit
    tag: MODELLED
    reasoning: >-
      Per-road multipliers let each covered authority × road match its DfT all-day speed
      (Robbie, 2026-09-27: match each road); the ridge keeps them near 1 where the
      class × area level already fits. Held-out validation tests whether they
      generalise; the parsimonious fit (no road multipliers) is reported alongside.
  validation_folds:
    value: 5
    unit: spatial folds for the bus hold-out
    tag: MODELLED
    reasoning: standard K for cross-validation; each fold holds ~20% of 2 km blocks
  validation_block_km:
    value: 2.0
    unit: km (square blocks)
    tag: MODELLED
    reasoning: >-
      Larger than a typical corridor segment run, so held-out segments are not
      neighbours of training segments on the same street (spatial blocking, plans/P2.md §5).
  validation_max_len_diff:
    value: 0.2
    unit: share |routed length ÷ ANPR link length − 1|
    tag: MODELLED
    reasoning: >-
      An ANPR link whose OSRM route differs from its recorded path by more than this
      is probably routed differently (one-way systems, bus gates); such links are
      excluded and listed.
  target_min_coverage:
    value: 0.8
    unit: share of an authority × road's DfT-local length inside the clip box
    tag: MODELLED
    reasoning: >-
      A DfT all-day road speed is used as a target only if most of that road (in that
      authority) is modelled; otherwise it describes road outside the model (e.g.
      Monmouthshire's A465, most of Wiltshire's A roads).
  spacing_bias_threshold:
    value: 0.05
    unit: share, |30 s speed ÷ 10 s speed − 1|
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-27: if the bias from 30 s spacing exceeds this in any road class ×
      area type cell, the measured correction is applied to archive speeds.

