# Behavioural and model parameters. Every value carries a tag (CLAUDE.md rule 2):
#   SOURCED needs `source`; CALIBRATED needs `target`; MODELLED needs `reasoning`;
#   PLACEHOLDER must be resolved before any published output.
# Values the spec attributes to a publication stay PLACEHOLDER until that publication
# has been opened and the figure confirmed (rule 3) — the claimed source is in `note`.
# `lab params` lists them; src/lab/params.py enforces the schema.

_meta:
  price_base: null        # set when the TAG data book values are entered (P5)
  status: P0 skeleton

commute:
  # d = 1 − (workers attending a fixed workplace on an average weekday ÷ BRES jobs).
  # Derived by src/lab/demand/bres_discount.py from the raw tables; tests check these
  # values match the derivation. Not the census TS058 36.2% (lockdown home-working,
  # already removed on the census side). See sources.md P1.
  bres_discount:
    low:
      value: 0.429
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − ONS OPN (GB, 8 Jan–30 Mar 2025, Table_1 by working pattern) attendance with
        hybrid workers on site 3 days/week and part-timers working 3.5 days. OPN counts
        anyone who travelled in the past 7 days, so it over-counts attendance: floor on d.
    central:
      value: 0.539
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − midpoint of OPN attendance (hybrid 2.5 days on site, per Indeed Hiring Lab
        Sept 2025; part-timers 3 days) and NTS attendance. The two are biased in
        opposite directions; the midpoint is a modelled choice.
    high:
      value: 0.604
      unit: share of BRES jobs
      tag: MODELLED
      reasoning: >-
        1 − NTS 2025 attendance: NTS0412 222.8 commuting trips per employed person
        per year × NTS0504b weekday share 0.899 ÷ 2 ÷ 253 weekdays. NTS counts only
        home ↔ usual-workplace trips, so it under-counts attendance: ceiling on d.
  destination_factor_check:
    value: 4.0
    unit: max in-extent destination factor
    tag: MODELLED
    reasoning: >-
      Was upstream's clipping cap (p95 rule, Bristol 2026-08). Now a check: the build
      fails if any in-extent destination factor exceeds it, instead of clipping. After
      the discount and the LSOA-centroid zone rule the largest factor is 2.55 (low d);
      the two MSOAs that used to reach it (Cotswold 011, Sedgemoor 002) were
      boundary slivers and are now external.
  ca_min_commuters:
    value: 10
    unit: ODWP14EW commuters in the cell
    tag: MODELLED
    reasoning: >-
      Smallest cell whose own car-availability split is used, at pair level and then at
      origin MSOA × destination LAD, before falling back to the origin MSOA. Upstream
      measured MSOA→MSOA at a mean flow of 21.95.

generalised_cost:
  w_walk:
    value: 2.0
    unit: IVT-min per walk-min
    tag: PLACEHOLDER
    note: spec default; confirm against TAG M3.2
  w_wait:
    value: 2.0
    unit: IVT-min per wait-min
    tag: PLACEHOLDER
    note: spec default; confirm against TAG M3.2
  p_interchange:
    value: 7.5
    range: [5, 10]
    unit: min per transfer
    tag: PLACEHOLDER
    note: spec gives 5–10 min; source from TAG / literature
  mode_constant_mass_transit:
    value: 0.0
    unit: min
    tag: MODELLED
    reasoning: >-
      Zero by default (SPEC §7.2). A non-zero quality bonus is the easiest way to
      flatter a scheme; if one is introduced, always report a run without it.
  game_weights:
    w_walk:
      value: 1.39
      unit: IVT-min per walk-min
      tag: PLACEHOLDER
      note: Subway Builder published weights, per spec; sensitivity runs only; verify
    w_wait:
      value: 1.37
      unit: IVT-min per wait-min
      tag: PLACEHOLDER
      note: Subway Builder published weights, per spec; sensitivity runs only; verify

skims:
  departure_window_min:
    value: 60
    unit: min
    tag: MODELLED
    reasoning: spec default (§7.1); smooths timetable phase without spanning periods
  percentiles:
    value: [25, 50, 75]
    unit: percentile
    tag: MODELLED
    reasoning: spec default (§7.1); p50 for accessibility, p25/p75 for spread

assignment:
  crowding_flag_load_factor:
    value: 0.8
    unit: pax / capacity
    tag: MODELLED
    reasoning: spec threshold (§7.4) for flagging links; no feedback into GC in v1

periods:
  AM: {value: "07:00-10:00", tag: MODELLED, reasoning: spec §6.3 period definition}
  IP: {value: "10:00-16:00", tag: MODELLED, reasoning: spec §6.3 period definition}
  PM: {value: "16:00-19:00", tag: MODELLED, reasoning: spec §6.3 period definition}

supply:
  clip_buffer_km:
    value: 5
    unit: km beyond the extent
    tag: MODELLED
    reasoning: >-
      Feeds (OSM, bus GTFS, vehicle locations) are clipped to the extent plus this
      margin so that routes and bus tracks near the edge are not truncated. 5 km is
      about one inter-urban bus stage; the plan's default (plans/P2.md A3).

# P2 car congestion (plans/P2.md §5). Set in P2b from the vehicle-location data; the
# notes give the starting values to test.
congestion:
  stop_buffer_m:
    value: null
    unit: m from a GTFS stop
    tag: PLACEHOLDER
    note: bus positions this close to a stop are dropped before computing moving speeds; start at 30
  min_moving_kmh:
    value: null
    unit: km/h
    tag: PLACEHOLDER
    note: positions slower than this are treated as dwelling, not moving; start at 5
  min_obs_per_link:
    value: null
    unit: traversals per way × direction × period
    tag: PLACEHOLDER
    note: a link's bus speed is used only with at least this many neutral-day traversals; start at 10
  spacing_bias_threshold:
    value: 0.05
    unit: share, |30 s speed ÷ 10 s speed − 1|
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-27: if the bias from 30 s spacing exceeds this in any road class ×
      area type cell, the measured correction is applied to archive speeds.

# P2 area types (plans/P2.md D4). Centre = urban LSOAs above this job density.
area_type:
  centre_job_density:
    value: null
    unit: BRES jobs per km²
    tag: PLACEHOLDER
    note: chosen in P2a so that it produces a few contiguous centres; plotted for review

car:
  parking_search_min:
    centre: {value: null, unit: min, tag: PLACEHOLDER, note: by destination area type}
    urban: {value: null, unit: min, tag: PLACEHOLDER, note: by destination area type}
    rural: {value: null, unit: min, tag: PLACEHOLDER, note: by destination area type}
  access_walk_min:
    centre: {value: null, unit: min, tag: PLACEHOLDER, note: car park to destination}
    urban: {value: null, unit: min, tag: PLACEHOLDER, note: car park to destination}
    rural: {value: null, unit: min, tag: PLACEHOLDER, note: car park to destination}

# Routing settings shared by r5r (PT) and r5py (walk, cycle), passed identically to
# both (plans/P2.md D7). The departure window is skims.departure_window_min.
routing:
  max_rides:
    value: 8
    unit: public transport rides per trip
    tag: MODELLED
    reasoning: >-
      r5py's default; r5r's default is 3, which changed p50 times on the D7 comparison.
      8 is effectively unlimited for this network, so the router, not a cap, decides.
  walk_speed_kmh:
    value: 3.6
    unit: km/h
    tag: PLACEHOLDER
    note: R5 default (1 m/s) in both engines; to be sourced (e.g. TAG / NTS) before published output
  cycle_speed_kmh:
    value: 12.0
    unit: km/h
    tag: PLACEHOLDER
    note: R5 default in both engines; to be sourced before published output
  max_bicycle_lts:
    value: 3
    unit: level of traffic stress (1–4)
    tag: PLACEHOLDER
    note: r5py default 3; r5r default 2 — must be passed explicitly to both; to be justified
  max_walk_min:
    value: null
    unit: min of walking per trip (access, transfer, egress)
    tag: PLACEHOLDER
    note: both engines default to no limit beyond the trip duration; decide in P2c
  max_trip_min:
    value: 120
    unit: min
    tag: MODELLED
    reasoning: >-
      Both engines' default. Longer than any internal commute of interest; pairs beyond
      it are unreachable.
  pt_reachable_share_min:
    value: 0.5
    unit: share of departure minutes in the window
    tag: MODELLED
    reasoning: >-
      Robbie, 2026-09-27 (D7): a pair is PT-unreachable if fewer than half the departure
      minutes have a route; this matches r5py's p50 (undefined below 50%).
