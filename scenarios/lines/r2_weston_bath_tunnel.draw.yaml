# Drawing spec for `lab scenario draw-rail`: R2's Weston-super-Mare – Bath Spa service through the city tunnel
# (heavy-rail programme phase 2, plans/heavy-rail-programme.md §3). Existing track is routed along OSM railway ways
# (26 Sep 2026 extract; © OpenStreetMap contributors, ODbL) over Darwin timing points; the tunnel is drawn straight
# between the points below, which are Robbie's sketch read off by eye and APPROXIMATE [MODELLED]:
#   south portal   (-2.6040, 51.4352) in the brief, snapped to the old four-track formation (OSM, 15 m)
#   North Street   (-2.6048, 51.4410)   Centre (-2.6000, 51.4525)   Broadmead (-2.5905, 51.4560)
#   Temple Meads East (-2.5795, 51.4528)   east portal (-2.5700, 51.4480)
#   junction onto the Bath line: the brief's point (-2.5660, 51.4490) is 220 m south of the OSM Bath line; snapped to
#   the track at (-2.56628, 51.45116).
# Tunnel legs total about 4.4 km (the brief says about 4.5). New track: the portal approach and the east portal to the
# junction are `at_grade_segregated`; the tunnel is `tunnel`.
out: r2_weston_bath_tunnel.geojson
kinds: [rail]
legs:
