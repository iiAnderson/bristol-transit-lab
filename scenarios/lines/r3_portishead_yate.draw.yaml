# Drawing spec for `lab scenario draw-rail`: R3's Portishead – Yate service through the city tunnel (heavy-rail
# programme phase 3, plans/heavy-rail-programme.md §4). Existing track is routed along OSM railway ways (26 Sep 2026
# extract; © OpenStreetMap contributors, ODbL) over Darwin timing points.
# The portal approach, the tunnel and the east portal to St Philip's Marsh junction are BUILT IN R2 and so are typed
# `existing_rail` here: R3 pays only for what it adds, the northern link, so the tunnel is not costed twice. Their
# timing points are the new ones in scenarios/infrastructure/untimed_sections.yaml; their run times come from the
# speed profile, as in R2.
# The northern link (about 1 km of new double track in the brief; 0.76 km drawn straight from the junction to Lawrence
# Hill, a lower bound) is `elevated`: a flyover with abutments built in R2 (W11). Positions as in
# r2_weston_bath_tunnel.draw.yaml; all [MODELLED].
# The two Portishead branch legs keep B2028's own speed profile (80 km/h, 0.5 m/s², scenarios/B2028.yaml), so the
# branch is not made faster by R3's electric-unit profile: that would be a gain the brief does not propose.
out: r3_portishead_yate.geojson
kinds: [rail, construction, disused]
legs:
  - {via: [[-2.75615, 51.48347], [-2.68691, 51.48127]], alignment_type: existing_rail, timing_points: [PRTSHD, PILL], speed_profile: {max_kmh: 80, accel_ms2: 0.5, dwell_s: 60}}
