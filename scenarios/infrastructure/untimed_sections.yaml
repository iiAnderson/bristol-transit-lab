# HAND-AUTHORED. Sections of line that no train in the Darwin timetable is timed over
# today, so `darwin_sections.yaml` cannot supply them: the freight-only Portishead branch,
# and the stations to be built on the Henbury line. A scenario's `existing_rail` segment may
# name them; their run times come from the speed-profile rule, not from working times
# (plans/P3.md D8), which is what `timed: false` means.
#
# What is sourced and what is not:
# - The station timing points exist in the Darwin reference data of 23 Sep 2026 with these
#   codes and CRS codes: PRTSHD (POH), PILL (PIA), HENBURY (HBR), NRHFILT (BBZ, "Bristol
#   Brabazon"). None has a service on that date.
# - Order on the Henbury line: the West of England Combined Authority's MetroWest Phase 2
#   business case update (October 2025; sources.md P3b-0) has the Filton Abbey Wood service
#   extended to North Filton and then Henbury, turning at Hallen Moor until Henbury's
#   turn-back exists. Darwin already times 14 trains a day each way FILTNEW – FILTNWJ –
#   HLNMOOR (in `darwin_sections.yaml`), so the two new stations lie between FILTNWJ and
#   HLNMOOR.
# - NOT YET SOURCED [MODELLED]: that the Portishead branch joins the main line at Parson
#   Street (PARSNST is the nearest station timing point; the junction itself, PARSNSJ, is in
#   the reference data but no train is timed at it). To be confirmed against a Network Rail
#   or MetroWest Phase 1 document when the B2028 alignment is drawn (P3b-4, rule 3).
sections:
  - {from: PARSNST, to: PILL, timed: false}
  - {from: PILL, to: PARSNST, timed: false}
  - {from: PILL, to: PRTSHD, timed: false}
  - {from: PRTSHD, to: PILL, timed: false}
  - {from: FILTNWJ, to: NRHFILT, timed: false}
  - {from: NRHFILT, to: FILTNWJ, timed: false}
  - {from: NRHFILT, to: HENBURY, timed: false}
  - {from: HENBURY, to: NRHFILT, timed: false}
  - {from: HENBURY, to: HLNMOOR, timed: false}
  - {from: HLNMOOR, to: HENBURY, timed: false}

# --- R2 / R3 city tunnel and northern link (heavy-rail programme, plans/heavy-rail-programme.md §3-4).
# HAND-AUTHORED, [MODELLED]: none of these points exists. The ids are invented timing points so that the
# speed-profile rule and the capacity check reach the new track (plans/heavy-rail-programme-log.md G4). Positions
# are read off Robbie's sketch and are approximate; the junction onto the Bath line is snapped to the OSM
# track (the brief's point is 220 m south of it) and joins the Bath line's existing timing points at
# North Somerset Junction (NSMRSTJ, the first point east of Bristol East Junction), whose own position is not
# in the data. New track is double track (the capacity default).
#   TNLSPTL  south portal, on the old four-track formation between Parson Street and Bedminster
#   TNLNSTR  North Street (Southville), underground       TNLCNTR  Centre (College Green), underground
#   TNLBRDM  Broadmead, underground                       TNLTMEE  Temple Meads East (Anvil Street), underground
#   TNLEPTL  east portal, St Philip's Marsh               SPMJCT   St Philip's Marsh junction, grade separated
  - {from: PARSNST, to: TNLSPTL, timed: false}
  - {from: TNLSPTL, to: PARSNST, timed: false}
  - {from: TNLSPTL, to: TNLNSTR, timed: false}
  - {from: TNLNSTR, to: TNLSPTL, timed: false}
  - {from: TNLNSTR, to: TNLCNTR, timed: false}
  - {from: TNLCNTR, to: TNLNSTR, timed: false}
  - {from: TNLCNTR, to: TNLBRDM, timed: false}
  - {from: TNLBRDM, to: TNLCNTR, timed: false}
  - {from: TNLBRDM, to: TNLTMEE, timed: false}
  - {from: TNLTMEE, to: TNLBRDM, timed: false}
  - {from: TNLTMEE, to: TNLEPTL, timed: false}
  - {from: TNLEPTL, to: TNLTMEE, timed: false}
  - {from: TNLEPTL, to: SPMJCT, timed: false}
  - {from: SPMJCT, to: TNLEPTL, timed: false}
  - {from: SPMJCT, to: NSMRSTJ, timed: false}
  - {from: NSMRSTJ, to: SPMJCT, timed: false}
  # R3's northern link: St Philip's Marsh junction to the Filton Bank slow pair at Lawrence Hill
  - {from: SPMJCT, to: LAWRNCH, timed: false}
  - {from: LAWRNCH, to: SPMJCT, timed: false}
