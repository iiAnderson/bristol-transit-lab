# HAND-AUTHORED. Limits and freight allowances for the track-capacity check (plans/P3.md
# D6). EVERY NUMBER HERE IS [MODELLED]: none comes from Network Rail's Sectional Appendix or
# Timetable Planning Rules, which have not been opened. The check built on them catches
# gross overloads only and proves nothing about a timetable.
#
# This file holds no `from`/`to` section list of its own: sections come from
# `darwin_sections.yaml` and `untimed_sections.yaml`.
defaults:
  tracks: 2
  # [MODELLED] A plain double-track section signalled for a planning headway of about
  # 4 minutes carries 15 trains an hour in theory; practical use is taken as 80% of that.
  double_track_tph: 12
  # [MODELLED] Single track: one train each way must clear the section before the next
  # enters, so trains per hour per direction = 60 ÷ (2 × run time + 2 × margin).
  single_track_margin_min: 3
  single_track_default_tph: 2
  # [MODELLED] Time a train stands at each station inside a single-track block, in minutes
  # (Darwin's median section run times exclude it). Used by `blocks` below.
  block_station_dwell_min: 0.5
# Single-track BLOCKS (plans/heavy-rail-programme-log.md G2): consecutive timing points between
# passing places. Trains in opposite directions cannot pass inside one, so a block carries one
# train pair per round trip over its whole length, not per station pair: the limit is
# 60 ÷ (2 × (summed run time + dwell inside) + 2 × margin) per direction, from today's Darwin
# median run times (`capacity.block_limits`). Redoubling and passing loops (the `works` op)
# split or remove them for a scenario and its children.
#
# SEVERN BEACH LINE. [MODELLED] from published descriptions; the layout of the Narroways –
# Avonmouth part is secondary, the part beyond Avonmouth is primary:
# - Bristol Rail Campaign, "How could Severn Beach Line capacity be improved?" (9 Mar 2023) and
#   Wikipedia, "Severn Beach line": single track from Narroways Hill Junction to Severn Beach, with
#   double-tracked loops and two platforms at Clifton Down and at Avonmouth. Passing places:
#   Clifton Down and Avonmouth.
# - Network Rail Signalling Design Group, Signalling Feasibility Report 139797 v1.1 (June 2015),
#   Appendix H of the MetroWest Phase 2 GRIP 1/2 report (travelwest.info), §2.1 and the Hallen Marsh
#   junction notes: "The single line from St Andrews Road to Severn Beach is dual operated by both
#   panels"; "alterations would be required to the one train working to Severn Beach"; the single
#   line is worked tokenless with sequential track circuits. That is one train on the branch at a time,
#   which is what a single block does. The passenger line from Avonmouth to Severn Beach is
#   controlled from St Andrews signal box.
# Network Rail's Sectional Appendix has not been opened. NOT MODELLED: level-crossing closure
# times at Avonmouth and St Andrews Road (the signalling report: extended closures, and an increase
# with every added train), the layover at Severn Beach, and the 300 m the campaign describes as single
# through the St Andrews Road crossing north of a double Avonmouth station (inside the block here).
# On today's timetable the long blocks are full or nearly so; see sources.md.
blocks:
  severn-beach-narroways-clifton-down:
    points: [STPLNAR, MONPELR, REDLAND, CLFDOWN]
  severn-beach-clifton-down-avonmouth:
    points: [CLFDOWN, SEMILLS, SHAMPTN, PTWYPR, AVONMTH]
  severn-beach-avonmouth-severn-beach:
    points: [AVONMTH, SADWJN, SADWRD, HLSMTHJ, SVRNBCH]
sections:
  # [MODELLED] The Portishead branch is taken as single track throughout. No source for its
  # track layout has been opened; the MetroWest Phase 1 documents would settle it.
  PRTSHD-PILL: {tracks: 1}
  PILL-PRTSHD: {tracks: 1}
  PILL-PARSNST: {tracks: 1}
  PARSNST-PILL: {tracks: 1}
freight:
  # [MODELLED] One freight path an hour each way where freight is known to run (Robbie,
  # 2026-10-10: Portishead branch, Henbury – Avonmouth, Filton Bank at least). Darwin holds
  # no freight, so this is an allowance, not a count. Planned source for counted paths:
  # Network Rail's open data SCHEDULE feed (OGL; access by account; whether it lists freight
  # paths is unconfirmed until there is access).
  - name: Portishead branch (dock traffic between the main line and the dock junction)
    tph: 1
    sections: [PARSNST-PILL, PILL-PARSNST]
  - name: Henbury line
    tph: 1
    sections: [FILTNWJ-NRHFILT, NRHFILT-FILTNWJ, NRHFILT-HENBURY, HENBURY-NRHFILT, HENBURY-HLNMOOR,
               HLNMOOR-HENBURY, FILTNWJ-HLNMOOR, HLNMOOR-FILTNWJ, FILTNEW-FILTNWJ, FILTNWJ-FILTNEW]
  - name: Filton Bank (Temple Meads to Filton Abbey Wood)
    tph: 1
    # every Darwin section between the timing points on the bank, fast and slow lines
    sections: [ASHYDN-HORFDJN, ASHYDN-STPLNAR, BRSTLEJ-BRSTLTM, BRSTLEJ-DRDAYSJ, BRSTLTM-BRSTLEJ,
               DRDAYSJ-BRSTLEJ, DRDAYSJ-HORFDJN, DRDAYSJ-LAWRNCH, DRDAYSJ-STPLNAR, FILTNEW-HORFDJN,
               HORFDJN-ASHYDN, HORFDJN-DRDAYSJ, HORFDJN-FILTNEW, HORFDJN-STPLNAR, LAWRNCH-DRDAYSJ,
               LAWRNCH-STPLTNR, STPLNAR-ASHYDN, STPLNAR-DRDAYSJ, STPLNAR-HORFDJN, STPLNAR-STPLTNR,
               STPLTNR-LAWRNCH, STPLTNR-STPLNAR]
# Junction conflicts (flat junctions with crossing moves) are NOT assessed: no junction data
# has been sourced.
junctions: []
