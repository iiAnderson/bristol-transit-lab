# P2a spikes (plans/P2.md A9). D2: a small car-network test area [min_lon, min_lat,
# max_lon, max_lat] with plenty of two-way primary/secondary roads.
spikes:
  # D3: Census 2021 OA→OA commute file in upstream's raw data (read-only).
  odwp01ew_oa: odwp01ew/ODWP01EW_OA.csv
  d2_box: [-2.64, 51.43, -2.54, 51.49]

# School calendar 2025/26 for neutral-day filters on WebTRIS (plans/P2.md §5, B3).
# North Somerset and B&NES publish identical terms (their council pages, checked
# 2026-09-27); South Gloucestershire's (proposed) document matches; Bristol's page no
# longer shows 2025/26 and is assumed to align (sources.md P2).
calendar_2025_26:
  terms:
    - [2025-06-02, 2025-07-22]      # end of 2024/25 term 6 (window starts 1 Jul 2025)
    - [2025-09-02, 2025-10-24]
    - [2025-11-03, 2025-12-19]
    - [2026-01-05, 2026-02-13]
    - [2026-02-23, 2026-04-02]
    - [2026-04-20, 2026-05-22]
    - [2026-06-01, 2026-07-22]
  bank_holidays: [2025-08-25, 2025-12-25, 2025-12-26, 2026-01-01, 2026-04-03,
                  2026-04-06, 2026-05-04, 2026-05-25]

# The baseline scenario and where its skims live (SPEC §4 as amended at P3):
# <skims>/<scenario>/<network_version>/<mode>/<period>.parquet. Car skims do not depend on
# the R5 network (OSRM on calibrated speeds), so they sit at <skims>/<scenario>/car/.
baseline:
  scenario: B2026
  scenarios_dir: scenarios
  infrastructure_dir: scenarios/infrastructure
  skims: data/interim/skims
  r5r: data/interim/r5r

# Frequent-service coverage (plans/P3.md P3a).
coverage:
  dir: data/interim/coverage
  # Census 2021 TS001 usual residents by OA: upstream's raw national download, read-only.
  # Upstream's `ts001` table holds only OAs inside its own extent polygon and lacks three
  # of the lab's internal OAs (sources.md P1), so the national file is read instead.
  ts001_oa: ts001/census2021-ts001-oa.csv
  # OA 2021 boundaries, generalised (BGC), for drawing coverage by OA. From ONS, not
  # upstream's `oa_geom`, which lacks the same three OAs. Service listed on the ONS Open
  # Geography ArcGIS server (navigated 2026-10-09).
  oa_bgc_service: https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Output_Areas_2021_EW_BGC_V2/FeatureServer/0
  oa_bgc: data/raw/ons_geo/oa21_bgc_internal.geojson
  # Deprivation indices, kept apart: the English and Welsh indices are not comparable
  # decile for decile (Robbie, 2026-10-09, Q12). Navigated 2026-10-09; see sources.md.
  deprivation:
    england:
      path: data/raw/deprivation/iod2025_file7.csv
      url: https://assets.publishing.service.gov.uk/media/691ded56d140bbbaa59a2a7d/File_7_IoD2025_All_Ranks_Scores_Deciles_Population_Denominators.csv
      page: https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025
      lsoa_column: "LSOA code (2021)"
      decile_column: "Index of Multiple Deprivation (IMD) Decile (where 1 is most deprived 10% of LSOAs)"
      licence: OGL v3
    wales:
      path: data/raw/deprivation/wimd2025_overall.json
      url: "https://datamap.gov.wales/geoserver/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:wimd2025_overall&outputFormat=application/json&propertyName=lsoa,rank,decile,lsoa_name_en"
      page: https://datamap.gov.wales/layers/geonode:wimd2025_overall
      licence: OGL v3 (Welsh Government; to be confirmed on the layer's metadata page before publication)
