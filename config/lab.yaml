# Where the lab finds its inputs. Place-specific configuration lives here, not in src/
# (CLAUDE.md rule 6).

# Upstream: subwaybuilder-bristol, packaged as ons_to_subwaybuilder (`otsb`).
# Opened read-only, always (rule 10). Override the repo path with LAB_UPSTREAM_REPO.
upstream:
  repo: ~/Documents/Projects/subwaybuilder-bristol
  db: data/interim/BRS/census.duckdb      # NOT data/interim/census.duckdb (pre-package build)
  package: ons_to_subwaybuilder
  city_config: ons_to_subwaybuilder/cities/bristol.yml
  raw: data/raw                          # upstream's national raw files, read-only

# Same extent as upstream Bristol & Bath: [min_lon, min_lat, max_lon, max_lat]
extent: [-3.02, 51.32, -2.28, 51.60]

# OA 2021 population-weighted centroids (ONS), for routing origins (D3).
oa_pwc_service: https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/OA_December_2021_EW_PWC_V4/FeatureServer/0

# P2 (plans/P2.md). Modelled date decided 2026-09-27 (D1): Wed 23 Sep 2026, term time.
modelled_date: 2026-09-23

# D8: PT metrics masked for these LADs (no Welsh bus timetables) — under review in A4.
mask:
  lads: [W06000022, W06000021]         # Newport, Monmouthshire

# D6 (approved at the P2a stop): direction is measured towards the nearest attractor.
# Each point is the population-weighted centroid of the highest-BRES-density LSOA in
# that town (2026-09-27): Bristol 054G (95,051 jobs/km²), Bath and North East Somerset
# 007A (34,658), Newport 014C (12,637), North Somerset 018D (8,607; North Somerset's
# densest, 001G, is the Portbury/Portishead employment area, not Weston).
centres:
  - {name: Bristol, lon: -2.5878, lat: 51.4518, lsoa: E01033903}
  - {name: Bath, lon: -2.3592, lat: 51.3843, lsoa: E01014370}
  - {name: Newport, lon: -3.0043, lat: 51.5812, lsoa: W01001686}
  - {name: Weston-super-Mare, lon: -2.9777, lat: 51.3514, lsoa: E01014844}

# D4: centre area type = urban, >= area_type.centre_job_density, contiguous cluster of
# >= this many LSOAs (approved at the P2a stop).
centre_min_cluster_lsoas: 3

# DfT authorities (LAD Dec 2024 codes) with internal LSOAs, for per-road targets.
authorities:
  Bristol: E06000023
  Bath and North East Somerset: E06000022
  North Somerset: E06000024
  South Gloucestershire: E06000025
  Newport: W06000022
  Monmouthshire: W06000021
  Wiltshire: E06000054

# B1: Metrobus route IDs, set from the modelled-date bus GTFS in A4.
metrobus_route_ids: []

paths:
  lab_db: data/interim/lab.duckdb
  runs: runs
  avl: data/raw/avl
  progress_log: plans/P2.md            # halt records from the AVL fetcher go in its §9

# Bus vehicle locations, BODS SIRI-VM (plans/P2.md A6, decided 2026-09-27).
avl:
  timezone: Europe/London              # hours below are local; archive filenames are UTC
  # Contact comes from LAB_CONTACT_EMAIL (secrets file, not committed).
  user_agent: "bristol-transit-lab/{version} (transport research; https://github.com/iiAnderson/bristol-transit-lab; contact: {contact})"
  archive:
    # National Data Library BODS archive (Open Innovations), OGL v3. One zip per ~30 s
    # snapshot, holding the national siri.xml.
    base_url: https://data.datalibrary.uk/transport/BODS-ARCHIVE/sirivm/
    # Tue–Thu of the first three full term weeks; 1–3 Sep excluded (first week of term).
    days: [2026-09-08, 2026-09-09, 2026-09-10, 2026-09-15, 2026-09-16, 2026-09-17,
           2026-09-22, 2026-09-23, 2026-09-24]
    hours: ["07:00", "16:00"]          # [start, end), local
    # Fetch policy agreed with Robbie (courtesy to a small volunteer service).
    policy:
      min_interval_s: 5                # between request starts; one request at a time
      max_interval_s: 20               # latency guard doubles 5 -> 10 -> 20
      timeout_s: 60
      backoff_start_s: 30
      backoff_max_s: 900
      breaker_consecutive: 5
      breaker_window_s: 900
      breaker_fail_share: 0.10
      breaker_min_requests: 20         # the share rule needs this many requests in the window
      latency_window: 50
      latency_factor: 2.0
  live:
    # BODS API (DfT). Key from BODS_API_KEY; never written anywhere.
    endpoint: https://data.bus-data.dft.gov.uk/api/v1/datafeed/
    days: [2026-09-29, 2026-09-30, 2026-10-01]
    hours: ["07:00", "16:00"]
    poll_s: 10
    flush_every_polls: 60

# Rail GTFS from Darwin (plans/P2.md A5). Files supplied by Robbie; see sources.md P2.
rail:
  darwin_timetable: data/raw/darwin/PPTimetable_20260923020537_v8.xml.gz
  darwin_ref: data/raw/darwin/PPTimetable_20260923020537_ref_v4.xml.gz
  naptan: data/raw/naptan/naptan_910_rail.csv
  # https://www.nationalrail.co.uk/developers/darwin-data-feeds/ (checked 2026-09-27)
  darwin_licence: "NRE OGL (OGL v2.0 with NRE amendments); attribution to National Rail as data provider required"
  naptan_url: https://naptan.api.dft.gov.uk/v1/access-nodes?dataFormat=csv&atcoAreaCodes=910
  out: data/interim/gtfs/rail_darwin.zip
  validator: data/tools/gtfs-validator-8.0.1-cli.jar    # MobilityData, GitHub release v8.0.1
  # TIPLOCs with no weekday service on the modelled date, and why. The presence check
  # fails if any other active NaPTAN station in the clip box is unserved, or any of
  # these is served.
  not_served:
    PILNING: Saturday-only service
    NRHFILT: Bristol Brabazon (North Filton), in NaPTAN as active but not yet served
    HENBURY: not open; Darwin reference only
    PILL: not open; Darwin reference only
    PRTSHD: Portishead, not open; Darwin reference only

# OSM (plans/P2.md A3): upstream's five Geofabrik extracts (Geofabrik has no
# south-west-england extract; see upstream sources.md). `-latest` URLs are resolved to
# the dated file, which is what gets recorded.
osm:
  extracts:
    - https://download.geofabrik.de/europe/united-kingdom/england/bristol-latest.osm.pbf
    - https://download.geofabrik.de/europe/united-kingdom/england/somerset-latest.osm.pbf
    - https://download.geofabrik.de/europe/united-kingdom/england/gloucestershire-latest.osm.pbf
    - https://download.geofabrik.de/europe/united-kingdom/england/wiltshire-latest.osm.pbf
    - https://download.geofabrik.de/europe/united-kingdom/wales-latest.osm.pbf
  raw_dir: data/raw/osm
  merged: data/interim/osm/merged.osm.pbf
  clip: data/interim/osm/b2026_clip.osm.pbf
  osrm_base: data/interim/osrm/b2026        # OSRM MLD files (osrm-extract/partition)

# WebTRIS (plans/P2.md A7): the latest 12 months published. Data lags ~3 months; on
# 2026-09-27 the last day with data was 30 Jun 2026.
webtris:
  start: 2025-07-01
  end: 2026-06-30
  min_interval_s: 1
  dir: data/raw/webtris

# Bus GTFS (plans/P2.md A4): the NDL archive's regional BODS GTFS for the modelled date.
# Wales is included to measure (and, if approved, use) Newport-area coverage (D8).
bus:
  feeds:
    south_west: data/raw/bods_gtfs/itm_south_west_gtfs_20260923.zip
    wales: data/raw/bods_gtfs/itm_wales_gtfs_20260923.zip
  source_url: https://data.datalibrary.uk/transport/BODS-ARCHIVE/timetables/2026/09/23/
  compare_date: 2026-10-07          # A4 check 2: a later Wednesday in the same feed
  out: data/interim/gtfs/bus_bods.zip

# P2a spikes (plans/P2.md A9). D2: a small car-network test area [min_lon, min_lat,
# max_lon, max_lat] with plenty of two-way primary/secondary roads.
spikes:
  # D3: Census 2021 OA→OA commute file in upstream's raw data (read-only).
  odwp01ew_oa: odwp01ew/ODWP01EW_OA.csv
  d2_box: [-2.64, 51.43, -2.54, 51.49]
